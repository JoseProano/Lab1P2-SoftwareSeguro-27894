services:
  # Vulnerability Detection API
  - type: web
    name: lab1p2-vulnerability-detector
    env: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONPATH
        value: /app
    healthCheckPath: /health
    autoDeploy: true

# Deploy via Docker
