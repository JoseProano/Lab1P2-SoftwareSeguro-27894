name: ML-Based Security Check

on:
  pull_request:
    branches: [ test, main ]

jobs:
  ml-security-analysis:
    name: ML Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn==1.5.0 numpy joblib xgboost pandas
      
      - name: Notify Telegram - Analysis Started
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🔍 ML Security Analysis Started%0APR: #${{ github.event.pull_request.number }}%0AModel: XGBoost (99.99%% accuracy)%0ACompliance: No LLMs - Only ML" \
            -d "parse_mode=Markdown"

      - name: Analyze Code with ML Model
        id: analyze
        run: |
          python3 scripts/cicd_analyzer.py src/ > analysis_output.txt 2>&1 || true
          cat analysis_output.txt
          
          # Check if vulnerable
          if grep -q "ANALYSIS FAILED" analysis_output.txt; then
            echo "vulnerable=1" >> $GITHUB_OUTPUT
            echo "❌ Code contains vulnerabilities"
          else
            echo "vulnerable=0" >> $GITHUB_OUTPUT
            echo "✅ Code is safe"
          fi

      - name: Notify Telegram - Vulnerable Code Detected
        if: steps.analyze.outputs.vulnerable == '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 *VULNERABILITY DETECTED*%0A%0APR: #${{ github.event.pull_request.number }}%0AAuthor: ${{ github.event.pull_request.user.login }}%0A%0AML Model Classification: VULNERABLE%0AModel: XGBoost (Accuracy: 99.99%%)%0A%0A❌ PR REJECTED - Requires fixing" \
            -d "parse_mode=Markdown"

      - name: Notify Telegram - Code is Safe
        if: steps.analyze.outputs.vulnerable == '0'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ *CODE IS SAFE*%0A%0APR: #${{ github.event.pull_request.number }}%0AML Model: XGBoost%0AAccuracy: 99.99%%%0A%0ANo vulnerabilities detected" \
            -d "parse_mode=Markdown"

      - name: Fail if vulnerable
        if: steps.analyze.outputs.vulnerable == '1'
        run: |
          echo "❌ ML model detected vulnerable code. Blocking PR."
          exit 1

  # NEW JOB: Deploy to Render (only on PR to main after merge)
  deploy-to-production:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ml-security-analysis
    if: github.event.pull_request.base.ref == 'main'
    
    steps:
      - name: Notify Telegram - Deployment Started
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚀 *DEPLOYMENT STARTED*%0A%0APR: #${{ github.event.pull_request.number }}%0ATarget: Render.com%0AStatus: Building Docker image..." \
            -d "parse_mode=Markdown"
      
      - name: Trigger Render Deployment
        id: deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK not configured"
            echo "status=skipped" >> $GITHUB_OUTPUT
          else
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            if [ $response -eq 200 ] || [ $response -eq 201 ]; then
              echo "status=triggered" >> $GITHUB_OUTPUT
              echo "✅ Deployment triggered successfully"
            else
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "❌ Deployment trigger failed: HTTP $response"
            fi
          fi
      
      - name: Wait for deployment
        if: steps.deploy.outputs.status == 'triggered'
        run: |
          echo "Waiting 90 seconds for Render to deploy..."
          sleep 90
      
      - name: Get Render Service URL
        id: get_url
        run: |
          # Hardcoded URL since render.yaml is not available in workflow context
          RENDER_URL="https://lab1p2-vulnerability-detector.onrender.com"
          echo "url=${RENDER_URL}" >> $GITHUB_OUTPUT
          echo "Service URL: ${RENDER_URL}"
      
      - name: Health Check
        id: health
        if: steps.deploy.outputs.status == 'triggered'
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.get_url.outputs.url }}/health || echo "000")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "status=healthy" >> $GITHUB_OUTPUT
              echo "✅ Service is healthy!"
              exit 0
            fi
            
            echo "Response: $RESPONSE - Waiting 15 seconds..."
            sleep 15
          done
          
          echo "status=unhealthy" >> $GITHUB_OUTPUT
          echo "⚠️ Health check timeout"
      
      - name: Notify Telegram - Deployment Success
        if: steps.health.outputs.status == 'healthy'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🎉 *DEPLOYMENT SUCCESSFUL*%0A%0APR: #${{ github.event.pull_request.number }}%0A✅ Deployed to production%0A🌐 URL: ${{ steps.get_url.outputs.url }}%0A🔍 Health check: PASSED%0A%0AModel: XGBoost (99.99%% accuracy)" \
            -d "parse_mode=Markdown"
      
      - name: Notify Telegram - Deployment Failed
        if: steps.health.outputs.status == 'unhealthy' || steps.deploy.outputs.status == 'failed'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ *DEPLOYMENT FAILED*%0A%0APR: #${{ github.event.pull_request.number }}%0A❌ Health check failed or deployment error%0A%0APlease check Render dashboard for details" \
            -d "parse_mode=Markdown"
      
      - name: Notify Telegram - Deployment Skipped
        if: steps.deploy.outputs.status == 'skipped'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=ℹ️ *DEPLOYMENT SKIPPED*%0A%0APR: #${{ github.event.pull_request.number }}%0ARENDER_DEPLOY_HOOK not configured%0A%0ATo enable: Add RENDER_DEPLOY_HOOK to GitHub Secrets" \
            -d "parse_mode=Markdown"
